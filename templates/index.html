<!DOCTYPE html>
<html>
<head>
    <title>IoT MQTT laborategi demoa</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        #map {
            width: 75%;
            height: 100%;
            float: left;
        }
    </style>
</head>
<body style="overflow: hidden">
    <div id="map"></div>
    <div id="info-panel" class="container" style="overflow: visible;">
        <div class="titleCard">
            <h3>MQTT Demo</h3>
        </div>
        <br>
        <div class="card">
            <p>Lat: <span id="lat">--</span></p>
            <p>Lon: <span id="lon">--</span></p>
            <p>Altitude: <span id="altitude">--</span> m</p>
            <p>Roll: <span id="roll">--</span> °</p>
            <p>Pitch: <span id="pitch">--</span> °</p>
        </div>
        <br>
        <div class="card">
            <h3>Airearen kalitatea</h3>
            <p>Tenperatura: <span id="temp">--</span> °C</p>
            <p>Presioa: <span id="pres">--</span> hPa</p>
            <p>Hezetasuna: <span id="humid">--</span></p>
        </div>
        <br>
        <div class="card">
            <h3>Bestelako sentsoreak:</h3>
            <p>rad: <span id="rad">--</span> µSv/h</p>
            <p>CPS: <span id="cps">--</span></p>
        </div>
    </div>

    <script src="static/mapUpdate.js"></script>

</body>
</html>
